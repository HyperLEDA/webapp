name: CI

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate code
        run: make gen

      - name: Run checks
        run: make check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate code
        run: make gen

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP=${{ matrix.app }}
          load: ${{ github.ref_name == github.event.repository.default_branch }}
          push: false
          tags: local/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Save image
        if: github.ref_name == github.event.repository.default_branch
        run: docker save local/${{ matrix.app }}:latest -o image-${{ matrix.app }}.tar

      - name: Upload image
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.app }}
          path: image-${{ matrix.app }}.tar
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        include:
          - app: web
            image: ghcr.io/hyperleda/hyperleda-webapp
          - app: admin
            image: ghcr.io/hyperleda/hyperleda-admin
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.app }}

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image
        run: docker load -i image-${{ matrix.app }}.tar

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker tag local/${{ matrix.app }}:latest ${{ matrix.image }}:${{ env.SHORT_SHA }}
          docker tag local/${{ matrix.app }}:latest ${{ matrix.image }}:latest
          docker push ${{ matrix.image }}:${{ env.SHORT_SHA }}
          docker push ${{ matrix.image }}:latest
